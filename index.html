<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>كاش فاستر | ملف الإدانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --emerald: #2ECC71;
            --emerald-dark: #27AE60;
            --gold: #D4AF37;
            --gold-dark: #B8960F;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --deep-blue: #0A0F1A;
            --glass-bg: rgba(10, 15, 26, 0.82);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-light: #F8FAFC;
            --text-muted: #8899AA;
            --danger: #EF4444;
            --danger-dark: #B91C1C;
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.7);
            --radius-xl: 2rem;
            --radius-lg: 1.4rem;
            --radius-md: 1rem;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--deep-blue);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0.8rem;
            position: relative;
            overflow-x: hidden;
        }
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(239, 68, 68, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 200, 255, 0.03) 0%, transparent 60%);
            animation: bgBreath 12s ease-in-out infinite alternate;
        }
        @keyframes bgBreath {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.04); }
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(239, 68, 68, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(239, 68, 68, 0.02) 1px, transparent 1px);
            background-size: 64px 64px;
            animation: gridSlide 30s linear infinite;
        }
        @keyframes gridSlide {
            0% { transform: translate(0, 0); }
            100% { transform: translate(64px, 64px); }
        }

        .app {
            max-width: 520px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: var(--radius-xl);
            padding: 1.4rem 1.2rem;
            box-shadow: var(--shadow-card), 0 0 80px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .app::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: radial-gradient(ellipse at 25% 20%, rgba(239, 68, 68, 0.04), transparent 55%);
            pointer-events: none;
            z-index: 0;
            animation: appGlow 30s linear infinite;
        }
        @keyframes appGlow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 2;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        .brand .logo-wrap {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--gold), var(--danger));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #0A0F1A;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3), 0 0 60px rgba(239, 68, 68, 0.08);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }
        .brand .logo-wrap:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(239, 68, 68, 0.4);
        }
        .brand .logo-wrap .pulse-ring {
            position: absolute;
            inset: -6px;
            border-radius: 18px;
            border: 2px solid rgba(239, 68, 68, 0.2);
            animation: ringPulse 2.5s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0; }
        }
        .brand .text .main {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF, var(--danger), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
        }
        .brand .text .main span {
            color: var(--danger);
            -webkit-text-fill-color: var(--danger);
        }
        .brand .text .sub {
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }
        .header .right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header .badge-status {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.12);
            border-radius: 3rem;
            padding: 0.25rem 0.9rem;
            font-size: 0.6rem;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .header .badge-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--danger);
            animation: dotPulse 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.7); }
        }
        .header .support-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 3rem;
            padding: 0.3rem 0.7rem;
            font-size: 0.6rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-family: 'Cairo', sans-serif;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .header .support-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #FFF;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .header .support-btn i {
            color: var(--danger);
            font-size: 0.7rem;
        }

        .final-stage-banner {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(212, 175, 55, 0.08));
            border: 2px solid var(--danger);
            border-radius: 3rem;
            padding: 0.5rem 1.2rem;
            margin: 0.6rem 0 0.8rem 0;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: bannerPulse 2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        @keyframes bannerPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); }
            50% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.25), 0 0 60px rgba(239, 68, 68, 0.05); }
        }
        .final-stage-banner i {
            color: var(--danger);
            font-size: 1.2rem;
        }
        .final-stage-banner .text {
            color: #FFF;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .final-stage-banner .text .hl-danger {
            color: var(--danger);
            font-weight: 800;
        }
        .final-stage-banner .text .hl-gold {
            color: var(--gold);
            font-weight: 800;
        }

        .search-box {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }
        .search-box input {
            flex: 1;
            padding: 0.7rem 1.2rem;
            border-radius: 3rem;
            border: 2px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            color: #FFF;
            font-size: 0.85rem;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--danger);
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.2);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box button {
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 3rem;
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
            color: #FFF;
            font-weight: 800;
            font-size: 0.75rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 25px rgba(239, 68, 68, 0.2);
            white-space: nowrap;
            animation: btnGlow 2s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0%, 100% { box-shadow: 0 4px 25px rgba(239, 68, 68, 0.2); }
            50% { box-shadow: 0 4px 45px rgba(239, 68, 68, 0.4); }
        }
        .search-box button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.4);
        }
        .search-box button i {
            font-size: 1rem;
        }

        #resultArea>*+* {
            margin-top: 0.8rem;
        }

        /* ===== ملف الإدانة ===== */
        .indictment-file {
            background: linear-gradient(145deg, #1a0a0a, #0d0505);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.2rem;
            border: 2px solid var(--danger);
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: indictmentGlow 3s ease-in-out infinite;
        }
        @keyframes indictmentGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.05); }
            50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.15), 0 0 80px rgba(239, 68, 68, 0.05); }
        }
        .indictment-file::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(239, 68, 68, 0.03), transparent, rgba(239, 68, 68, 0.05), transparent);
            animation: rotateGlow 15s linear infinite;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .indictment-file .header-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 3rem;
            padding: 0.3rem 1.2rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }
        .indictment-file .header-badge i {
            color: var(--danger);
            font-size: 1.2rem;
        }
        .indictment-file .header-badge span {
            color: var(--danger);
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .indictment-file .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--danger);
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
            margin-bottom: 0.2rem;
            position: relative;
            z-index: 1;
        }
        .indictment-file .sub-title {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 1.2rem;
            position: relative;
            z-index: 1;
        }
        .indictment-file .sub-title .hl-danger {
            color: var(--danger);
            font-weight: 700;
        }
        .indictment-file .divider {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--danger), transparent);
            margin: 0.8rem 0;
            opacity: 0.3;
            position: relative;
            z-index: 1;
        }

        .indictment-file .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }
        .indictment-file .info-grid .item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 0.6rem 0.5rem;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.05);
        }
        .indictment-file .info-grid .item .lbl {
            font-size: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .indictment-file .info-grid .item .val {
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 0.1rem;
        }
        .indictment-file .info-grid .item .val.danger {
            color: var(--danger);
        }
        .indictment-file .info-grid .item .val.gold {
            color: var(--gold);
        }
        .indictment-file .info-grid .item.full {
            grid-column: span 2;
        }

        .indictment-file .warning-box {
            background: rgba(239, 68, 68, 0.06);
            border: 2px solid var(--danger);
            border-radius: var(--radius-md);
            padding: 0.8rem;
            margin: 0.8rem 0;
            position: relative;
            z-index: 1;
        }
        .indictment-file .warning-box .icon {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }
        .indictment-file .warning-box .icon i {
            color: var(--danger);
            font-size: 1.2rem;
        }
        .indictment-file .warning-box .icon span {
            color: var(--danger);
            font-weight: 800;
            font-size: 0.85rem;
        }
        .indictment-file .warning-box p {
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.9;
            margin: 0;
        }
        .indictment-file .warning-box p .hl-danger {
            color: var(--danger);
            font-weight: 700;
        }
        .indictment-file .warning-box p .hl-gold {
            color: var(--gold);
            font-weight: 700;
        }

        .indictment-file .actions {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 0.8rem;
            position: relative;
            z-index: 1;
        }
        .indictment-file .actions .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .indictment-file .actions .btn:hover {
            transform: scale(1.02);
        }
        .indictment-file .actions .btn-danger {
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
            color: #FFF;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2);
            animation: btnDangerPulse 2s ease-in-out infinite;
        }
        @keyframes btnDangerPulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2); }
            50% { box-shadow: 0 4px 40px rgba(239, 68, 68, 0.4); }
        }
        .indictment-file .actions .btn-danger:hover {
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.5);
        }
        .indictment-file .actions .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0A0F1A;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }
        .indictment-file .actions .btn-gold:hover {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.35);
        }
        .indictment-file .actions .btn-whatsapp {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #FFF;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.2);
        }
        .indictment-file .actions .btn-whatsapp:hover {
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.35);
        }

        .indictment-file .footer-note {
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 0.8rem;
            position: relative;
            z-index: 1;
            border-top: 1px solid rgba(239, 68, 68, 0.1);
            padding-top: 0.6rem;
        }
        .indictment-file .footer-note .hl-danger {
            color: var(--danger);
            font-weight: 700;
        }

        .error-card {
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid var(--danger);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
            color: var(--danger);
            font-size: 0.8rem;
            display: none;
            margin-top: 0.6rem;
        }
        .loader {
            text-align: center;
            display: none;
            padding: 0.8rem 0;
        }
        .loader i {
            color: var(--danger);
            font-size: 1.8rem;
        }
        .loader p {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 0.2rem;
        }

        .footer {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.6rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }

        .admin-panel {
            display: none;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            padding: 0.8rem;
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
            margin-top: 0.8rem;
        }
        .admin-panel.show {
            display: block;
        }
        .admin-panel .title {
            font-size: 0.75rem;
            color: var(--gold);
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.4rem;
        }
        .admin-panel .group {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .admin-panel .group button {
            flex: 1;
            min-width: 70px;
            padding: 0.4rem 0.5rem;
            border: none;
            border-radius: 3rem;
            font-size: 0.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
        }
        .admin-panel .group button:hover {
            transform: scale(1.03);
        }
        .btn-admin-pending {
            background: var(--warning);
            color: #0A0F1A;
        }
        .btn-admin-completed {
            background: var(--emerald);
            color: #0A0F1A;
        }
        .btn-admin-blocked {
            background: var(--danger);
            color: #FFF;
        }
        .admin-panel .status-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.3rem;
        }

        @media (max-width: 440px) {
            .app { padding: 1rem 0.8rem; border-radius: var(--radius-lg); }
            .brand .text .main { font-size: 1.1rem; }
            .brand .logo-wrap { width: 38px; height: 38px; font-size: 1.2rem; }
            .header .badge-status { font-size: 0.5rem; padding: 0.15rem 0.6rem; }
            .header .support-btn { font-size: 0.5rem; padding: 0.15rem 0.5rem; }
            .final-stage-banner { padding: 0.4rem 0.8rem; gap: 0.4rem; }
            .final-stage-banner i { font-size: 1rem; }
            .final-stage-banner .text { font-size: 0.7rem; }
            .search-box button { font-size: 0.65rem; padding: 0.6rem 1rem; }
            .indictment-file .title { font-size: 1.3rem; }
            .indictment-file .info-grid { grid-template-columns: 1fr 1fr; gap: 0.3rem; }
            .indictment-file .info-grid .item .val { font-size: 0.75rem; }
            .indictment-file .info-grid .item.full { grid-column: span 2; }
            .search-box { flex-direction: column; }
            .search-box button { width: 100%; justify-content: center; }
        }
        @media (max-width: 360px) {
            .brand .text .main { font-size: 0.95rem; }
            .brand .logo-wrap { width: 32px; height: 32px; font-size: 1rem; }
            .header .badge-status { display: none; }
            .indictment-file .title { font-size: 1.1rem; }
            .indictment-file .info-grid { grid-template-columns: 1fr; }
            .indictment-file .info-grid .item.full { grid-column: span 1; }
            .final-stage-banner .text { font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="bg-grid"></div>

    <div class="app">

        <header class="header">
            <a href="#" class="brand" onclick="return false;">
                <div class="logo-wrap">
                    <span class="pulse-ring"></span>
                    <span>⚡</span>
                </div>
                <div class="text">
                    <span class="main">Cash<span>Fast</span></span>
                    <span class="sub">منصة التمويل الذكية</span>
                </div>
            </a>
            <div class="right">
                <div class="badge-status">
                    <span class="dot"></span>
                    <span>نشط</span>
                </div>
                <button class="support-btn" id="supportHeaderBtn" title="الدعم الفني">
                    <i class="fas fa-headset"></i>
                    <span class="hide-mobile">دعم</span>
                </button>
            </div>
        </header>

        <div class="final-stage-banner">
            <i class="fas fa-gavel"></i>
            <span class="text">

        function displayResult(customer, nationalId) {
            currentCustomer = customer;
            currentNationalId = nationalId;
            const area = document.getElementById('resultArea');
            area.innerHTML = buildIndictmentFile(customer);
            document.getElementById('errorBox').style.display = 'none';
        }

        function searchCustomer() {
            const nationalId = document.getElementById('nationalId').value.trim();
            if (!nationalId) {
                alert('⚠️ الرجاء إدخال الرقم القومي');
                return;
            }
            if (nationalId.length !== 14) {
                alert('⚠️ الرقم القومي يجب أن يكون 14 رقمًا');
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultArea').innerHTML = '';
            document.getElementById('errorBox').style.display = 'none';

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                const customer = customersDatabase[nationalId];
                if (!customer) {
                    document.getElementById('errorBox').style.display = 'block';
                    currentCustomer = null;
                    currentNationalId = null;
                    return;
                }
                displayResult(customer, nationalId);
            }, 600);
        }

        function toggleAdmin() {
            isAdmin = !isAdmin;
            document.getElementById('adminPanel').classList.toggle('show', isAdmin);
        }

        function changeStatus(newStatus) {
            if (!currentCustomer || !currentNationalId) {
                alert('⚠️ يرجى البحث عن عميل أولاً.');
                return;
            }
            if (!confirm(`هل أنت متأكد من تغيير حالة العميل ${currentCustomer.name} إلى "${newStatus}"؟`)) return;
            customersDatabase[currentNationalId].status = newStatus;
            document.getElementById('currentStatusText').textContent = newStatus;
            displayResult(customersDatabase[currentNationalId], currentNationalId);
            alert(`✅ تم تغيير الحالة إلى "${newStatus}" بنجاح.`);
        }

        });

        document.getElementById('nationalId')?.addEventListener('keypress', e => {

        });
