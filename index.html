    const loanDisplay = customer.loan.toLocaleString('ar-EG');
    const installmentDisplay = customer.installmentAmount ? customer.installmentAmount.toLocaleString('ar-EG') : '5,000';
    const totalInstallments = customer.totalInstallments || 10;
    const paidInstallments = customer.paidInstallments || 0;
    const remainingInstallments = totalInstallments - paidInstallments;
    const firstInstallmentDate = customer.firstInstallment || "22/8/2026";
    const transactionId = `CF-${Date.now().toString().slice(-8)}-${Math.floor(Math.random() * 1000)}`;
    
    const today = new Date();
    const nextDueDate = new Date(firstInstallmentDate);

    const isOverdue = daysUntilDue < 0;

    const html = `

            msg += `المبلغ: ${loanDisplay} ج.م\n`;
            msg += `رقم المحفظة: ${customer.walletNum || 'سيتم تحديده'}\n\n`;
            msg += `أقر أنا ${customer.name} بأنني استلمت المبلغ على محفظتي.`;
            openWhatsApp(msg);
        };
    }
}

// ===== البحث الرئيسي =====
function searchCustomer() {
    const nationalId = document.getElementById('nationalId').value.trim();
    if (!nationalId) { 
        alert('⚠️ الرجاء إدخال الرقم القومي'); 
        return; 
    }
    if (nationalId.length !== 14) { 
        alert('⚠️ الرقم القومي يجب أن يكون 14 رقمًا'); 
        return; 
    }
    
    document.getElementById('loader').style.display = 'block';
    document.getElementById('resultSection').innerHTML = '';
    document.getElementById('errorCard').style.display = 'none';
    
    setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        const customer = customersDatabase[nationalId];
        
        if (!customer) {
            document.getElementById('errorCard').style.display = 'block';
            currentCustomer = null;
            currentNationalId = null;
            return;
        }
        
        currentCustomer = customer;
        currentNationalId = nationalId;
        
        // التحقق من حالة العميل
        if (customer.status === 'installment') {
            buildInstallmentPage(customer, nationalId);
        } else if (customer.status === 'processing') {
            buildProcessingPage(customer, nationalId);
        } else {
            buildLoanDisbursedPage(customer, nationalId);
        }
    }, 800);
}

// ===== ربط حدث Enter =====
document.getElementById('nationalId')?.addEventListener('keypress', e => { 
    if (e.key === 'Enter') searchCustomer(); 
});

// ===== جعل الدوال عالمية =====
window.searchCustomer = searchCustomer;
window.openWhatsApp = openWhatsApp;
</script>
